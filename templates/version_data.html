{% extends "base.html" %}

{% block title %}{{ version_name }} - View Data{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ version_name }} - Uploaded Data</h1>
    <p class="subtitle">{{ version_date }}</p>
</div>

<div class="filters" style="margin-bottom: 1rem;">
    <input type="text" id="search-input" placeholder="Search by product name...">
    <select id="category-filter">
        <option value="">All Categories</option>
    </select>
    <select id="location-filter">
        <option value="">All Locations</option>
        <option value="HYD">HYD</option>
        <option value="BLR">BLR</option>
        <option value="MUM">MUM</option>
        <option value="PUNE">PUNE</option>
        <option value="NCR">NCR</option>
    </select>
</div>

<div class="table-responsive">
    <table class="data-table">
        <thead>
            <tr>
                <th>Product Name</th>
                <th class="col-category">Category</th>
                <th class="col-unit">Unit</th>
                <th>Location</th>
                <th>Cost</th>
            </tr>
        </thead>
        <tbody id="results-body"></tbody>
    </table>
</div>

<div class="action-buttons" style="margin-top: 1.5rem;">
    <a href="{{ url_for('versions') }}" class="btn btn-secondary">Back to Versions</a>
</div>
{% endblock %}

{% block scripts %}
<script>
    window.versionId = {{ version_id }};
</script>
<script src="{{ url_for('static', filename='js/version_data.js') }}"></script>
{% endblock %}
